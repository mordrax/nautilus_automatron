[project]
name = "nautilus-automatron-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyarrow>=18.0.0",
    "pandas>=2.2.0",
    "pydantic-settings>=2.6.0",
    "nautilus_trader",
    "nautilus-automatron-indicators",
    "nautilus-automatron-runner",
]

[tool.uv.sources]
nautilus-automatron-indicators = { path = "../indicators", editable = true }
nautilus-automatron-runner = { path = "../runner", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
